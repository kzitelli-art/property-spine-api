<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lease Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#ffffff; --ink:#17191b; --ink-soft:#33373b; --muted:#6b7178; --faint:#a2a7ac;
      --line:#e8e6e1; --line-strong:#d5d2cb; --rule:#1f2123;
      --green:#2f7d46; --green-bg:#f4f9f5; --green-line:#cfe4d4;
      --red:#a3373c; --red-bg:#fbf3f3;
      --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

    /* top notice — hairline monospace rule */
    .demo-note{border-bottom:1px solid var(--line);color:var(--muted);
      font-family:var(--mono);font-size:11.5px;line-height:1.55;letter-spacing:.01em;
      padding:11px 0}
    .demo-note .inner{max-width:660px;margin:0 auto;padding:0 28px}
    .demo-note b{color:var(--ink);font-weight:500}

    .shell{max-width:660px;margin:0 auto;padding:0 28px 160px}

    /* ── MASTHEAD ── owner/property identity as the document's letterhead ── */
    .masthead{padding:52px 0 0}
    .mh-eyebrow{color:var(--faint);text-transform:uppercase;letter-spacing:.22em;
      font-size:10.5px;font-weight:500;font-family:var(--mono)}
    .mh-title{margin:16px 0 20px;font-size:40px;line-height:1.02;font-family:var(--serif);
      font-weight:400;letter-spacing:0}
    .mh-meta{display:flex;flex-wrap:wrap;gap:4px 34px;padding:18px 0;
      border-top:1px solid var(--rule);border-bottom:1px solid var(--line)}
    .mh-meta .item{min-width:0}
    .mh-meta .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--faint);margin-bottom:4px}
    .mh-meta .v{font-size:14px;color:var(--ink);font-weight:500}
    .lede{margin:24px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.62;max-width:58ch}
    .lede .em{color:var(--ink);font-weight:500}

    /* ── TERMS TABLE ── the money summary as a formal two-column schedule ── */
    .schedule{margin:40px 0 8px}
    .schedule-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted);margin-bottom:2px}
    .schedule table{width:100%;border-collapse:collapse;margin-top:10px}
    .schedule tr{border-bottom:1px solid var(--line)}
    .schedule tr:first-child{border-top:1px solid var(--rule)}
    .schedule td{padding:13px 0;vertical-align:baseline;font-size:14.5px}
    .schedule td.k{color:var(--muted);width:42%}
    .schedule td.v{text-align:right;font-family:var(--mono);font-weight:500;
       font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--ink)}

    /* ── BODY — numbered sections, hairline separated ── */
    .body-head{margin:52px 0 4px;display:flex;align-items:baseline;gap:12px}
    .body-head .doc-title{font-size:15px;font-family:var(--mono);font-weight:500;
      text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
    .section{border-top:1px solid var(--line);padding:26px 0;scroll-margin-top:20px;
      display:grid;grid-template-columns:36px 1fr;gap:0 4px}
    .section:first-of-type{border-top:1px solid var(--rule)}
    .sec-num{font-family:var(--mono);font-size:13px;color:var(--faint);
      padding-top:3px;font-variant-numeric:tabular-nums}
    .sec-body{min-width:0}
    .section h3{margin:0 0 12px;font-size:19px;font-family:var(--serif);font-weight:400;
      letter-spacing:0;line-height:1.2}
    .section p{margin:10px 0;line-height:1.66;font-size:14.5px;color:var(--ink-soft)}

    /* acknowledge row — a hairline row within the section column */
    .field{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:16px}
    .field-title{font-weight:500;font-size:13.5px}
    .field small{display:block;color:var(--faint);margin-top:3px;font-family:var(--mono);
      font-size:10.5px;letter-spacing:.03em;text-transform:uppercase}
    .field.done .field-title{color:var(--muted)}

    /* buttons — near-black ink, precise */
    button{border:1px solid var(--ink);border-radius:4px;padding:8px 18px;
      font-weight:500;font-family:var(--sans);font-size:13px;cursor:pointer;
      background:var(--ink);color:var(--paper);transition:opacity .15s;letter-spacing:.01em}
    button:hover{opacity:.82}
    button:disabled{opacity:.3;cursor:not-allowed}
    .field.done button{border-color:var(--green-line);background:var(--green-bg);color:var(--green)}
    .signature-entry{display:flex;align-items:center;gap:8px;min-width:260px}
    .signature-entry input{min-width:0;flex:1;border:1px solid var(--line-strong);border-radius:4px;
      padding:8px 10px;font:13px var(--sans);color:var(--ink);background:#fff}
    .signature-entry input:focus{outline:2px solid var(--green-line);outline-offset:1px}

    .instrument{margin:42px 0 8px;border-top:1px solid var(--rule);padding-top:24px}
    .instrument-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .instrument h2{font:400 22px/1.2 var(--serif);margin:3px 0 5px}
    .instrument-meta{font:10.5px/1.6 var(--mono);color:var(--muted);overflow-wrap:anywhere}
    .source-link{display:inline-flex;align-items:center;justify-content:center;flex:none;
      border:1px solid var(--ink);border-radius:4px;padding:8px 12px;color:var(--ink);
      text-decoration:none;font-size:12.5px;font-weight:500}
    .source-link:hover{background:#f6f6f4}
    .lease-text{margin:20px 0 0;border:1px solid var(--line);background:#fbfbfa;
      max-height:520px;overflow:auto;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;
      font:12.5px/1.65 var(--sans);color:var(--ink-soft)}

    /* progress — inline schedule of what remains */
    .progress{margin:44px 0 0;border-top:1px solid var(--rule);padding-top:24px}
    .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
    .progress-head h3{margin:0;font-size:12px;font-family:var(--mono);font-weight:500;
      text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
    .progress-head .count{font-family:var(--mono);font-size:13px;color:var(--ink);
      font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .meter{height:2px;background:var(--line);overflow:hidden;margin-bottom:16px}
    .meter>div{height:100%;background:var(--ink);width:0%;transition:width .35s ease}
    .todo{display:flex;align-items:center;gap:13px;padding:10px 0;font-size:13.5px;
      cursor:pointer;border-bottom:1px solid var(--line)}
    .todo:last-child{border-bottom:0}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:none}
    .todo.done .dot{background:var(--green)}
    .todo b{font-weight:400;flex:1;color:var(--ink)}
    .todo.done b{color:var(--muted)}
    .todo span{color:var(--faint);font-size:10.5px;font-family:var(--mono);
      text-transform:uppercase;letter-spacing:.08em}
    .submit{margin-top:26px;width:100%;padding:14px 16px;font-size:13.5px;border-radius:4px;
      letter-spacing:.02em}

    .notice{margin-top:24px;padding:18px 20px;border:1px solid var(--green-line);
      background:var(--green-bg);color:#2a5c3a;line-height:1.62;font-size:14px;display:none}
    .notice b{color:var(--green)}
    .error{margin-top:18px;padding:14px 16px;border:1px solid #e4c4c6;
      background:var(--red-bg);color:var(--red);font-size:14px;display:none}

    /* closing colophon */
    .colophon{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
      font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--faint);letter-spacing:.02em}

    @media (max-width:560px){
      .shell{padding:0 20px 130px}
      .demo-note .inner{padding:0 20px}
      .mh-title{font-size:32px}
      .masthead{padding-top:38px}
      .mh-meta{gap:14px 24px}
      .section{grid-template-columns:26px 1fr}
      .field{align-items:flex-start;flex-direction:column}
      .signature-entry{width:100%;min-width:0}
      .instrument-head{display:block}
      .source-link{margin-top:14px;width:100%}
    }
  </style>
</head>
<body>
  <div class="demo-note" id="phBar"><div class="inner"><b>Loading lease.</b></div></div>
  <main class="shell">
    <header class="masthead">
      <div class="mh-eyebrow">Lease Terms Review</div>
      <h1 class="mh-title" id="mhTitle">Proposed Terms</h1>
      <div class="mh-meta" id="mhMeta"></div>
      <p class="lede" id="lede">Loading your lease details.</p>
    </header>

    <div class="schedule" id="schedule"></div>
    <div id="instrumentBlock"></div>

    <div class="body-head">
      <div class="doc-title" id="paperTitle">Terms</div>
    </div>
    <div id="sections"></div>
    <div class="notice" id="notice"></div>
    <div class="error" id="error"></div>

    <section class="progress">
      <div class="progress-head">
        <h3 id="progressLabel">To complete</h3>
        <div class="count" id="progressText">Loading…</div>
      </div>
      <div class="meter"><div id="meter"></div></div>
      <div id="todos"></div>
      <button class="submit" id="submitBtn" disabled>Complete Review</button>
    </section>

    <div class="colophon" id="colophon"></div>
  </main>

  <script>
    // token is the LAST path segment of /t/lease/:token
    const parts = location.pathname.split('/').filter(Boolean);
    const token = decodeURIComponent(parts[parts.length - 1] || '');
    const DATA_BASE = location.pathname.replace(/\/$/, '');  // /t/lease/:token
    let packet = null;

    function sessionId(){
      const k='lease_packet_session'; let id=sessionStorage.getItem(k);
      if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()); sessionStorage.setItem(k,id); }
      return id;
    }
    function esc(s){return String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
    function displayDate(value){
      const match=String(value||'').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!match)return value||'—';
      return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})
        .format(new Date(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]))));
    }
    function displayMoney(value){
      const number=Number(String(value??'').replace(/[$,]/g,''));
      return Number.isFinite(number)
        ? number.toLocaleString('en-US',{style:'currency',currency:'USD'})
        : '$'+String(value??'');
    }

    async function api(path, options={}){
      const res = await fetch(path, { ...options, headers:{'Content-Type':'application/json', ...(options.headers||{})} });
      const json = await res.json().catch(()=>({}));
      if(!res.ok) throw json;
      return json;
    }

    async function load(){
      if(!token) return showError('Lease link is missing.');
      const data = await api(DATA_BASE + '/data');
      packet = data.packet;
      render();
    }

    function render(){
      const snap = packet.rendered_snapshot||{}, terms = packet.terms||{};
      const S = snap.summary||{};
      const propName = terms.property_name || snap.title || 'Proposed Terms';
      const addr = snap.subtitle || terms.property_address || '';
      const governing = packet.is_governing_lease_package === true;

      document.title = governing ? 'Sign Lease Package' : 'Lease Terms Review';
      document.getElementById('phBar').innerHTML = governing
        ? '<div class="inner"><b>Official lease package.</b> The retained property lease and the exact deal terms below are one package. Your signature applies to both; the company must countersign before activation.</div>'
        : '<div class="inner"><b>Demonstration summary.</b> Proposed lease terms for review — not the complete lease. Acknowledging does not create or activate a tenancy; the complete lease and required addenda govern.</div>';
      document.getElementById('lede').innerHTML = governing
        ? 'Review the home, dates, and charges, then read the official lease below. Type your full legal name where requested and sign the <span class="em">complete package</span>.'
        : 'Review each numbered term and acknowledge it below. This records your review only — <span class="em">it is not a signature on the lease</span>, and a tenancy begins only when the owner executes the complete lease.';
      document.getElementById('progressLabel').textContent = governing ? 'Required before signing' : 'To acknowledge';
      document.getElementById('submitBtn').textContent = governing ? 'Sign Lease Package' : 'Acknowledge Demonstration Terms';

      // masthead
      document.getElementById('mhTitle').textContent = propName;
      const term = displayDate(S.lease_start_date) + ' – ' + displayDate(S.lease_end_date);
      const metaItems = [
        ['Premises', esc(addr || (S.unit ? 'Unit '+S.unit : '—'))],
        ['Owner', esc(S.landlord_entity||'—')],
        ['Resident', esc(S.resident_names||terms.resident_names||'—')],
        ['Term', esc(term)],
      ];
      document.getElementById('mhMeta').innerHTML = metaItems.map(
        ([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');

      // schedule (money terms as a formal table)
      const rows = [];
      if(S.monthly_rent) rows.push(['Monthly rent', displayMoney(S.monthly_rent)]);
      if(S.security_deposit) rows.push(['Security deposit', displayMoney(S.security_deposit)]);
      // pull fee/notice figures out of the sections if present
      const feeSec = (snap.sections||[]).find(s=>s.key==='fees');
      const noticeSec = (snap.sections||[]).find(s=>s.key==='notice');
      (feeSec?.body||[]).forEach(line=>{
        const m = line.match(/^([A-Za-z /()-]+?):?\s*\$?([\d,]+\.\d{2})/);
        if(m) rows.push([m[1].trim(), '$'+m[2]]);
      });
      document.getElementById('schedule').innerHTML = rows.length ? `
        <div class="schedule-cap">Schedule of terms</div>
        <table>${rows.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td></tr>`).join('')}</table>` : '';

      const instrument = snap.instrument || null;
      document.getElementById('instrumentBlock').innerHTML = governing && instrument ? `
        <section class="instrument" aria-labelledby="instrumentTitle">
          <div class="instrument-head">
            <div>
              <div class="schedule-cap">Governing lease form</div>
              <h2 id="instrumentTitle">${esc(instrument.source_filename || instrument.form_code || 'Residential lease')}</h2>
              <div class="instrument-meta">Form ${esc(instrument.form_code || '—')}${instrument.form_version ? ' · version '+esc(instrument.form_version) : ''}<br>Package ${esc((instrument.package_sha256 || '').slice(0,16))}</div>
            </div>
            <a class="source-link" href="${esc(DATA_BASE + '/instrument')}">Download original</a>
          </div>
          <pre class="lease-text" tabindex="0">${esc(instrument.text_snapshot || '')}</pre>
        </section>` : '';

      document.getElementById('paperTitle').textContent = governing ? 'Deal Terms' : 'Terms';

      // numbered body sections
      const bySection = new Map();
      for(const f of packet.fields||[]){ const l=bySection.get(f.section_key)||[]; l.push(f); bySection.set(f.section_key,l); }
      let n=0;
      const html = (snap.sections||[]).map(sec=>{
        n++;
        const fields = bySection.get(sec.key)||[];
        const num = String(n).padStart(2,'0');
        return `<section class="section" id="section-${esc(sec.key)}">
          <div class="sec-num">${num}</div>
          <div class="sec-body">
            <h3>${esc(sec.title)}</h3>
            ${(sec.body||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
            ${fields.map(fieldHtml).join('')}
          </div>
        </section>`;
      }).join('');
      document.getElementById('sections').innerHTML = html;

      // colophon
      document.getElementById('colophon').textContent =
        (governing
          ? 'The retained source hash and deal-terms hash are bound in the package shown above.'
          : (snap.not_the_lease || 'Demonstration summary — not the complete lease.')) +
        (addr ? '  ·  ' + addr : '');

      renderProgress();
    }

    function fieldHtml(f){
      const done=f.completed;
      const action = f.field_type==='signature'?'Sign':(f.field_type==='acknowledgment'?'Acknowledge':'Initial');
      const signatureControl = f.field_type==='signature' && !done
        ? `<div class="signature-entry"><input aria-label="Full legal name" data-signature-name="${esc(f.id)}" autocomplete="name" placeholder="Full legal name"><button data-complete="${esc(f.id)}" data-ftype="signature">Sign</button></div>`
        : `<button ${done?'disabled':''} data-complete="${esc(f.id)}" data-ftype="${esc(f.field_type)}">${done?'Done':action}</button>`;
      return `<div class="field ${done?'done':''}" id="field-${esc(f.id)}">
        <div><div class="field-title">${esc(f.label)}</div><small>${done?(f.field_type==='signature'?'Signed':'Acknowledged'):action+' to continue'}</small></div>
        ${signatureControl}
      </div>`;
    }

    function renderProgress(){
      const req=(packet.fields||[]).filter(f=>f.required);
      const done=req.filter(f=>f.completed);
      const pct=req.length?Math.round(done.length/req.length*100):0;
      document.getElementById('progressText').textContent=`${done.length} / ${req.length}`;
      document.getElementById('meter').style.width=pct+'%';
      document.getElementById('todos').innerHTML=req.map(f=>`<div class="todo ${f.completed?'done':''}" data-jump="${esc(f.id)}"><i class="dot"></i><b>${esc(f.label)}</b><span>${f.completed?'done':'open'}</span></div>`).join('');
      // A packet whose property carries a governing instrument comes to rest
      // in 'resident_executed' (184), not 'submitted'. Reading only the old
      // name left the button live on a packet the resident had already
      // signed, inviting a second submit. Found in a browser, not in source.
      const submitted = packet.status==='submitted'
        || packet.status==='resident_executed' || packet.status==='executed';
      document.getElementById('submitBtn').disabled = done.length!==req.length || submitted;
      if(submitted) showSubmitted();
    }

    function initials(){
      const n=packet.terms?.resident_names||'';
      const i=n.split(/[\s,]+/).filter(Boolean).map(x=>x[0]).join('').slice(0,4).toUpperCase();
      return i||'ACK';
    }

    async function completeField(id,type){
      try{
        const signatureInput = type==='signature' ? document.querySelector(`[data-signature-name="${CSS.escape(id)}"]`) : null;
        const value = type==='signature' ? String(signatureInput?.value||'').trim() : initials();
        if(type==='signature' && value.length<2){ showError('Type your full legal name before signing.'); signatureInput?.focus(); return; }
        const data = await api(DATA_BASE+`/fields/${id}/complete`,{method:'POST',body:JSON.stringify({value,consent:type==='signature',session_id:sessionId()})});
        packet=data.packet; render(); jumpNext();
      }catch(e){ showError(e.receipt||e.error||'Could not record that field.'); }
    }

    async function submitPacket(){
      try{
        const data = await api(DATA_BASE+'/submit',{method:'POST',body:JSON.stringify({session_id:sessionId()})});
        packet=data.packet; render(); showSubmitted();
        window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
      }catch(e){ showError((e.outstanding?'Finish all required items first.':'')||e.receipt||e.error||'Could not submit.'); }
    }

    function showSubmitted(){
      const el=document.getElementById('notice');
      el.innerHTML=packet?.is_governing_lease_package
        ? '<b>Signed.</b> Your signature on the complete lease package is recorded. The authorized company signer must countersign before the tenancy is activated.'
        : '<b>Acknowledged.</b> Your review of the demonstration terms is recorded. This does <b>not</b> activate a lease — a tenancy begins only when the owner executes the complete lease and required addenda through the normal process.';
      el.style.display='block';
    }
    function jump(id){document.getElementById('field-'+id)?.scrollIntoView({behavior:'smooth',block:'center'});}
    function jumpNext(){const n=(packet.fields||[]).find(f=>f.required&&!f.completed); if(n)jump(n.id); else document.getElementById('submitBtn')?.scrollIntoView({behavior:'smooth',block:'center'});}
    function showError(m){const el=document.getElementById('error');el.textContent=m;el.style.display='block';}

    document.addEventListener('click',function(ev){
      const c=ev.target.closest('[data-complete]');
      if(c && !c.disabled){ completeField(c.dataset.complete, c.dataset.ftype); return; }
      const j=ev.target.closest('[data-jump]');
      if(j){ jump(j.dataset.jump); }
    });
    document.getElementById('submitBtn').addEventListener('click',submitPacket);
    load().catch(e=>showError(e.receipt||e.error||'This page could not be loaded.'));
  </script>
</body>
</html>
