services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: property_spine
      POSTGRES_USER: spine
      POSTGRES_PASSWORD: spine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spine -d property_spine"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://spine:spine@db:5432/property_spine
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
